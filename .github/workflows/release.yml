# SPDX-License-Identifier: LGPL-2.1-or-later
name: Release

# LibreMac publishes no binary yet. The app it builds is signed ad-hoc, which
# Gatekeeper rejects on any machine but the one that built it, so a downloadable
# .app or disk image would be an artefact nobody can open; that arrives with a
# Developer ID, notarization and stapling, and this workflow gains a build job
# then. Until that day a release here is the notes taken from CHANGELOG.md,
# published under a tag the project key signed: ci/release-assets.txt declares
# no asset, and the publish step holds the release to that.
#
# The workflow deliberately performs NO build, which also keeps it off a macOS
# runner.
#
# Two modes. A tag push publishes. A dispatch rehearses by default, on any
# ref: the same preflight (mode, the tag verifier proved on fixtures, VERSION
# against CHANGELOG, the locked LibreAgent revision) and the same notes and
# asset checks, with nothing created. `publish` is refused on a ref that is
# not a tag.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'rehearse (any ref) or publish (a tag ref only)'
        type: choice
        options: [rehearse, publish]
        default: rehearse

permissions: {}

# One run per ref at a time: a re-run racing a still-live earlier run would
# hand gh release create an already-existing release and fail at the last step.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.pre.outputs.mode }}
      version: ${{ steps.pre.outputs.version }}
      is_prerelease: ${{ steps.pre.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: pre
        uses: LibreSCRS/ci/actions/release-preflight@bd36eee50ba085ef4f052ea2767cff910e2e62e7
        with:
          mode: ${{ inputs.mode || 'publish' }}
          # Every version surface here is derived from VERSION at generate
          # time (ci.yml measures the built bundle), so VERSION against the
          # CHANGELOG is the one arm there is to run.
          version-arms: lockstep

  publish:
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: LibreSCRS/ci/actions/release-publish@bd36eee50ba085ef4f052ea2767cff910e2e62e7
        with:
          mode: ${{ needs.preflight.outputs.mode }}
          version: ${{ needs.preflight.outputs.version }}
          is_prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          artifacts: ''

# SPDX-License-Identifier: LGPL-2.1-or-later
name: Release

# A release of LibreMac is a universal (x86_64 + arm64) disk image holding the
# menu-bar app, its token extension, and the agent and prompter built from the
# LibreDarwin revision deps.lock names, with the LibreMiddleware libraries that
# revision locks. Scripts/bundle-agent.sh stages, Scripts/sign-bundle.sh signs,
# Scripts/verify-bundle.sh checks -- including running the agent -- before it
# is imaged.
#
# The bundle is signed ad hoc: there is no Developer ID yet, so it is not
# notarised and Gatekeeper refuses it on first open until the user allows it
# (the release notes say how). An ad hoc signature under the hardened runtime
# is subject to library validation, so the agent carries
# disable-library-validation until a Developer ID replaces the signature. With
# a Developer ID, the identity and a notarize + staple step go into the build
# job; nothing else changes shape.
#
# A published build names its team: the organization variable LIBRESCRS_TEAM_ID
# reaches LibreDarwin's configure and Scripts/generate-project.sh, the App Group
# is named after it, and the clients require the agent to be signed by it. A
# rehearsal builds without a team, signed ad hoc. Scripts/sign-bundle.sh refuses
# a team with an ad hoc signature, so publishing waits for the Developer ID.
#
# Two modes. A tag push publishes. A dispatch rehearses by default, on any
# ref, and so does a push to main or ci/** that touches what the image is
# made from: the same build, bill of materials, checksums and signatures
# (with a throwaway key), with nothing created. `publish` is refused on a ref
# that is not a tag.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
    branches: [main, 'ci/**']
    # Not evaluated for tag pushes, which always run.
    paths:
      - 'Scripts/bundle-agent.sh'
      - 'Scripts/verify-bundle.sh'
      - 'Scripts/sign-bundle.sh'
      - 'Scripts/select-xcode.sh'
      - '.xcode-version'
      - 'Scripts/lm-soname.sh'
      - 'Packaging/**'
      - 'project.yml'
      - 'deps.lock'
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'ci/release-assets.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'rehearse (any ref) or publish (a tag ref only)'
        type: choice
        options: [rehearse, publish]
        default: rehearse

permissions: {}

# One run per ref at a time: a re-run racing a still-live earlier run would
# hand gh release create an already-existing release and fail at the last step.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.pre.outputs.mode }}
      version: ${{ steps.pre.outputs.version }}
      is_prerelease: ${{ steps.pre.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pre
        uses: LibreSCRS/ci/actions/release-preflight@2e5c95f7e9a54325bc0321775c0d8c08002aebea
        with:
          mode: ${{ inputs.mode || (github.ref_type == 'tag' && 'publish' || 'rehearse') }}
          # Every version surface here is derived from VERSION at generate
          # time (ci.yml measures the built bundle), so VERSION against the
          # CHANGELOG is the one arm there is to run.
          version-arms: lockstep

  build-macos:
    needs: [preflight]
    # xcode-27 is the runner image that carries the Xcode in .xcode-version
    # (images are keyed by Xcode major; arm64 only, x86_64 is cross-built).
    runs-on: xcode-27
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      LM_PREFIX: ${{ github.workspace }}/.lm-prefix
      # The team a release is signed by, from the organization-level variable;
      # the App Group is named after it. A rehearsal builds without a team,
      # signed ad hoc.
      LIBRESCRS_TEAM_ID: ${{ needs.preflight.outputs.mode == 'publish' && vars.LIBRESCRS_TEAM_ID || '' }}
    steps:
      - name: A release names its team
        if: needs.preflight.outputs.mode == 'publish'
        run: |
          if [ -z "$LIBRESCRS_TEAM_ID" ]; then
            echo "::error::publish needs the organization variable LIBRESCRS_TEAM_ID: without it the App Group stays group.org.librescrs.LibreMac, which macOS 27 refuses to the sandboxed host and extension"
            exit 1
          fi

      - name: Install build tools
        # xcodegen generates the Xcode project; ninja and the autotools build
        # LibreMiddleware (its vendored OpenSC bootstraps with autoconf);
        # jsonschema is its plugin manifest code generator's; bash 4 is what
        # the shared checkout and bill-of-materials scripts need.
        run: |
          brew install xcodegen ninja autoconf automake libtool pkg-config bash
          python3 -m pip install --break-system-packages --user jsonschema

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the Xcode in .xcode-version and its SDK
        run: ./Scripts/select-xcode.sh

      - name: Checkout LibreAgent and LibreDarwin at this repository's lock
        id: deps
        uses: LibreSCRS/ci/actions/checkout-deps@2e5c95f7e9a54325bc0321775c0d8c08002aebea
        with:
          names: LibreAgent LibreDarwin
          fetch-depth: '0'

      - name: Checkout LibreMiddleware at LibreDarwin's lock
        # deps-lock holds LibreDarwin's LibreAgent to this repository's, so
        # the one LibreAgent checkout above is the one LibreDarwin builds.
        id: lm
        uses: LibreSCRS/ci/actions/checkout-deps@2e5c95f7e9a54325bc0321775c0d8c08002aebea
        with:
          root: .deps/LibreDarwin
          consumer: LibreDarwin
          names: LibreMiddleware
          fetch-depth: '0'
          submodules: recursive

      - name: Build and install LibreMiddleware (Release, shared, universal)
        env:
          LM_SRC: ${{ steps.lm.outputs.libremiddleware-path }}
        run: |
          cmake -S "$LM_SRC" -B .build-lm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_INSTALL_PREFIX="$LM_PREFIX" \
            -DLIBREMIDDLEWARE_BUILD_SHARED=ON
          cmake --build .build-lm -j4
          cmake --install .build-lm
          # Every library the bundle will stage carries both slices. One arch per
          # call: Xcode 27's lipo takes a second -verify_arch argument for an
          # input file and fails ("requires exactly one input file").
          find "$LM_PREFIX/lib" -name '*.dylib' -type f | while read -r lib; do
            for arch in x86_64 arm64; do
              lipo "$lib" -verify_arch "$arch" \
                || { echo "::error::$lib is $(lipo -archs "$lib"), not x86_64 + arm64"; exit 1; }
            done
          done

      - name: Build LibreDarwin (Release, universal)
        # The agent core links OpenSSL itself (find_package), and left alone it
        # finds Homebrew's, which on this runner is arm64 only: the x86_64
        # slice of the agent then fails to link every OpenSSL symbol it uses.
        # LibreMiddleware at this lock carries a universal static OpenSSL for
        # macOS (thirdparty/openssl-<version>/macosx, both slices lipo'd), the
        # one its own libraries link; the agent links the same one.
        env:
          LD_SRC: ${{ steps.deps.outputs.libredarwin-path }}
          LA_SRC: ${{ steps.deps.outputs.libreagent-path }}
          LM_SRC: ${{ steps.lm.outputs.libremiddleware-path }}
        run: |
          echo "SDKROOT=$SDKROOT"
          shopt -s nullglob
          ossl=("$LM_SRC"/thirdparty/openssl-*/macosx)
          [ "${#ossl[@]}" -eq 1 ] || { echo "::error::want one thirdparty/openssl-*/macosx in LibreMiddleware, found ${#ossl[@]}"; exit 1; }
          lipo -info "${ossl[0]}/lib/libcrypto.a"
          cmake -S "$LD_SRC" -B "$LD_SRC/build-release" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBREDARWIN_UNIVERSAL=ON \
            -DCMAKE_PREFIX_PATH="$LM_PREFIX" \
            -DOPENSSL_ROOT_DIR="${ossl[0]}" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DLIBRESCRS_TEAM_ID="$LIBRESCRS_TEAM_ID" \
            -DFETCHCONTENT_SOURCE_DIR_LIBREAGENT="$LA_SRC"
          grep -E '^OPENSSL_CRYPTO_LIBRARY' "$LD_SRC/build-release/CMakeCache.txt"
          cmake --build "$LD_SRC/build-release" -j4

      - name: Build LibreMac (Release, universal, unsigned)
        run: |
          set -o pipefail
          ./Scripts/generate-project.sh
          xcodebuild -project LibreMac.xcodeproj -scheme LibreMac -configuration Release \
            -derivedDataPath DerivedData -jobs 4 \
            ARCHS="x86_64 arm64" ONLY_ACTIVE_ARCH=NO build

      - name: Stage the agent into the app, sign the bundle, and verify it
        env:
          LD_SRC: ${{ steps.deps.outputs.libredarwin-path }}
          LIBREDARWIN_EXPECTED_ARCHS: x86_64 arm64
        run: |
          app=DerivedData/Build/Products/Release/LibreMac.app
          ./Scripts/bundle-agent.sh "$app" "$LD_SRC/build-release" "$LM_PREFIX/lib"
          ./Scripts/sign-bundle.sh "$app"
          ./Scripts/verify-bundle.sh "$app"

      - name: Disk image
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage" out
          ditto DerivedData/Build/Products/Release/LibreMac.app "$stage/LibreMac.app"
          ln -s /Applications "$stage/Applications"
          # On the hosted xcode-27 image hdiutil create has failed with
          # "Resource busy" on a tree that verified clean, while the same
          # command passes locally on macOS 27. Three tries, each failure said.
          for try in 1 2 3; do
            if hdiutil create -volname "LibreMac $VERSION" -srcfolder "$stage" \
                 -format UDZO -o "out/LibreMac-$VERSION-macos.dmg"; then
              break
            fi
            echo "::warning::hdiutil create failed (try $try of 3)"
            rm -f "out/LibreMac-$VERSION-macos.dmg"
            [ "$try" -lt 3 ] || exit 1
            sleep 15
          done
          hdiutil verify "out/LibreMac-$VERSION-macos.dmg"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/ci
          ref: 2e5c95f7e9a54325bc0321775c0d8c08002aebea
          path: .ci
          persist-credentials: false

      - name: Bill of materials for what the image bundles
        # The host is Swift with no third-party code; what the image carries
        # beyond it is the agent, which links LibreAgent statically and ships
        # the LibreMiddleware libraries. Both are read from the trees built
        # above, each at the revision LibreDarwin's lock names.
        env:
          LD_SRC: ${{ steps.deps.outputs.libredarwin-path }}
          LA_SRC: ${{ steps.deps.outputs.libreagent-path }}
          LM_SRC: ${{ steps.lm.outputs.libremiddleware-path }}
        run: |
          "$(brew --prefix)/bin/bash" .ci/scripts/make-sbom --out out/sbom-macos.cdx.json \
            --root "$LD_SRC" --repo LibreMac \
            --static-dep "LibreAgent=$LA_SRC" --static-dep "LibreMiddleware=$LM_SRC" \
            --require openssl --require qcbor

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: macos-artifacts
          path: out/*
          if-no-files-found: error
          retention-days: 3

  seal:
    needs: [preflight, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: macos-artifacts
          path: artifacts

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/ci
          ref: 2e5c95f7e9a54325bc0321775c0d8c08002aebea
          path: .ci
          persist-credentials: false

      - name: Refuse a release whose bill of materials is missing or empty
        # Before anything is signed: a signature over a document this job is
        # about to reject is worth not creating.
        run: python3 .ci/scripts/check-sbom artifacts/sbom-macos.cdx.json

      - uses: LibreSCRS/ci/actions/release-seal@2e5c95f7e9a54325bc0321775c0d8c08002aebea
        with:
          mode: ${{ needs.preflight.outputs.mode }}
          version: ${{ needs.preflight.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sealed
          path: artifacts/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [preflight, seal]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sealed
          path: artifacts
      - uses: LibreSCRS/ci/actions/release-publish@2e5c95f7e9a54325bc0321775c0d8c08002aebea
        with:
          mode: ${{ needs.preflight.outputs.mode }}
          version: ${{ needs.preflight.outputs.version }}
          is_prerelease: ${{ needs.preflight.outputs.is_prerelease }}

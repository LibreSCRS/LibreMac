# SPDX-License-Identifier: LGPL-2.1-or-later
name: Release

# A release is one universal (x86_64 + arm64) disk image holding LibreMac (the
# menu-bar app, its token extension, and the agent and prompter built from the
# LibreDarwin revision deps.lock names, with the LibreMiddleware libraries that
# revision locks) and LibreCelik, both from the revisions deps.lock names.
# Scripts/bundle-agent.sh stages, Scripts/sign-bundle.sh signs,
# Scripts/verify-bundle.sh checks -- including running the agent -- before it
# is imaged. LibreCelik is built and tested here and packaged by its own
# scripts/macos/build-app.sh, then launched once before it is imaged.
#
# The bundle is signed ad hoc: there is no Developer ID yet, so it is not
# notarised and Gatekeeper refuses it on first open until the user allows it
# (the release notes say how). An ad hoc signature under the hardened runtime
# is subject to library validation, so the agent carries
# disable-library-validation until a Developer ID replaces the signature. With
# a Developer ID, the identity and a notarize + staple step go into the build
# job; nothing else changes shape.
#
# A published build names its team: the organization variable LIBRESCRS_TEAM_ID
# reaches LibreDarwin's configure and Scripts/generate-project.sh, the App Group
# is named after it, and the clients require the agent to be signed by it. A
# rehearsal builds without a team, signed ad hoc. Scripts/sign-bundle.sh refuses
# a team with an ad hoc signature, so publishing waits for the Developer ID.
#
# Two modes. A tag push publishes. A dispatch rehearses by default, on any
# ref, and so does a push to main or ci/** that touches what the image is
# made from: the same build, bill of materials, checksums and signatures
# (with a throwaway key), with nothing created. `publish` is refused on a ref
# that is not a tag.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
    branches: [main, 'ci/**']
    # Not evaluated for tag pushes, which always run.
    paths:
      - 'Scripts/bundle-agent.sh'
      - 'Scripts/verify-bundle.sh'
      - 'Scripts/sign-bundle.sh'
      - '.xcode-version'
      - 'Scripts/lm-soname.sh'
      - 'Packaging/**'
      - 'project.yml'
      - 'deps.lock'
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'ci/release-assets.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'rehearse (any ref) or publish (a tag ref only)'
        type: choice
        options: [rehearse, publish]
        default: rehearse

permissions: {}

# One run per ref at a time: a re-run racing a still-live earlier run would
# hand gh release create an already-existing release and fail at the last step.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.pre.outputs.mode }}
      version: ${{ steps.pre.outputs.version }}
      is_prerelease: ${{ steps.pre.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pre
        uses: LibreSCRS/ci/actions/release-preflight@d68f5d781a665759eaba63c67ef0e6eb1f738063
        with:
          mode: ${{ inputs.mode || (github.ref_type == 'tag' && 'publish' || 'rehearse') }}
          # Every version surface here is derived from VERSION at generate
          # time (ci.yml measures the built bundle), so VERSION against the
          # CHANGELOG is the one arm there is to run.
          version-arms: lockstep

  build-macos:
    needs: [preflight]
    # xcode-27 is the runner image that carries the Xcode in .xcode-version
    # (images are keyed by Xcode major; arm64 only, x86_64 is cross-built).
    runs-on: xcode-27
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      LM_PREFIX: ${{ github.workspace }}/.lm-prefix
      # The team a release is signed by, from the organization-level variable;
      # the App Group is named after it. A rehearsal builds without a team,
      # signed ad hoc.
      LIBRESCRS_TEAM_ID: ${{ needs.preflight.outputs.mode == 'publish' && vars.LIBRESCRS_TEAM_ID || '' }}
    steps:
      - name: A release names its team
        if: needs.preflight.outputs.mode == 'publish'
        run: |
          if [ -z "$LIBRESCRS_TEAM_ID" ]; then
            echo "::error::publish needs the organization variable LIBRESCRS_TEAM_ID: without it the App Group stays group.org.librescrs.LibreMac, which macOS 27 refuses to the sandboxed host and extension"
            exit 1
          fi

      - name: Install build tools
        # xcodegen generates the Xcode project; ninja and the autotools build
        # LibreMiddleware (its vendored OpenSC bootstraps with autoconf);
        # jsonschema is its plugin manifest code generator's; bash 4 is what
        # the shared checkout and bill-of-materials scripts need.
        run: |
          brew install xcodegen ninja autoconf automake libtool pkg-config bash
          python3 -m pip install --break-system-packages --user jsonschema

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the Xcode in .xcode-version and its SDK
        uses: LibreSCRS/ci/actions/select-xcode@d68f5d781a665759eaba63c67ef0e6eb1f738063

      - name: Checkout LibreAgent, LibreDarwin and LibreCelik at this repository's lock
        id: deps
        uses: LibreSCRS/ci/actions/checkout-deps@d68f5d781a665759eaba63c67ef0e6eb1f738063
        with:
          names: LibreAgent LibreDarwin LibreCelik
          fetch-depth: '0'

      - name: Checkout LibreMiddleware at LibreDarwin's lock
        # deps-lock holds LibreDarwin's LibreAgent to this repository's, so
        # the one LibreAgent checkout above is the one LibreDarwin builds.
        id: lm
        uses: LibreSCRS/ci/actions/checkout-deps@d68f5d781a665759eaba63c67ef0e6eb1f738063
        with:
          root: .deps/LibreDarwin
          consumer: LibreDarwin
          names: LibreMiddleware
          fetch-depth: '0'
          submodules: recursive

      - name: Build and install LibreMiddleware (Release, shared, universal)
        env:
          LM_SRC: ${{ steps.lm.outputs.libremiddleware-path }}
        run: |
          cmake -S "$LM_SRC" -B .build-lm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_INSTALL_PREFIX="$LM_PREFIX" \
            -DBUILD_TESTING=OFF
          cmake --build .build-lm -j4
          cmake --install .build-lm
          # Every library the bundle will stage carries both slices. One arch per
          # call: Xcode 27's lipo takes a second -verify_arch argument for an
          # input file and fails ("requires exactly one input file").
          find "$LM_PREFIX/lib" -name '*.dylib' -type f | while read -r lib; do
            for arch in x86_64 arm64; do
              lipo "$lib" -verify_arch "$arch" \
                || { echo "::error::$lib is $(lipo -archs "$lib"), not x86_64 + arm64"; exit 1; }
            done
          done

      - name: Build LibreDarwin (Release, universal)
        # The agent core links OpenSSL itself (find_package), and left alone it
        # finds Homebrew's, which on this runner is arm64 only: the x86_64
        # slice of the agent then fails to link every OpenSSL symbol it uses.
        # LibreDarwin's packaging/select-openssl.sh names LibreMiddleware's
        # universal static OpenSSL, the one its own libraries link, in the same
        # way LibreDarwin's own CI does.
        # Warnings are errors here as in LibreDarwin's own CI: this is the
        # compiler the shipped agent is built with, and the only place its
        # warnings are seen. CMake only warns about a -D for an option the tree
        # no longer declares ("not used") and builds on without it, so the
        # cache is held to the option afterwards: declared, the entry is a
        # BOOL; undeclared, it stays UNINITIALIZED.
        env:
          LD_SRC: ${{ steps.deps.outputs.libredarwin-path }}
          LA_SRC: ${{ steps.deps.outputs.libreagent-path }}
          LM_SRC: ${{ steps.lm.outputs.libremiddleware-path }}
        run: |
          echo "SDKROOT=$SDKROOT"
          "$LD_SRC/packaging/select-openssl.sh" "$LM_SRC" "$RUNNER_TEMP/openssl.cmake"
          cmake -C "$RUNNER_TEMP/openssl.cmake" -S "$LD_SRC" -B "$LD_SRC/build-release" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBREDARWIN_UNIVERSAL=ON \
            -DBUILD_TESTING=OFF \
            -DLIBRESCRS_WERROR=ON \
            -DCMAKE_PREFIX_PATH="$LM_PREFIX" \
            -DLIBRESCRS_TEAM_ID="$LIBRESCRS_TEAM_ID" \
            -DFETCHCONTENT_SOURCE_DIR_LIBREAGENT="$LA_SRC"
          if ! grep -qx 'LIBRESCRS_WERROR:BOOL=ON' "$LD_SRC/build-release/CMakeCache.txt"; then
            echo "::error::LibreDarwin's configure did not take LIBRESCRS_WERROR=ON as a declared option: $(grep '^LIBRESCRS_WERROR:' "$LD_SRC/build-release/CMakeCache.txt" || echo 'no cache entry')"
            exit 1
          fi
          grep -E '^OPENSSL_CRYPTO_LIBRARY' "$LD_SRC/build-release/CMakeCache.txt"
          cmake --build "$LD_SRC/build-release" -j4

      - name: Build LibreMac (Release, universal, unsigned)
        run: |
          set -o pipefail
          ./Scripts/generate-project.sh
          xcodebuild -project LibreMac.xcodeproj -scheme LibreMac -configuration Release \
            -derivedDataPath DerivedData -jobs 4 \
            ARCHS="x86_64 arm64" ONLY_ACTIVE_ARCH=NO build

      - name: Stage the agent into the app, sign the bundle, and verify it
        env:
          LD_SRC: ${{ steps.deps.outputs.libredarwin-path }}
          LIBREDARWIN_EXPECTED_ARCHS: x86_64 arm64
        run: |
          app=DerivedData/Build/Products/Release/LibreMac.app
          ./Scripts/bundle-agent.sh "$app" "$LD_SRC/build-release" "$LM_PREFIX/lib"
          ./Scripts/sign-bundle.sh "$app"
          ./Scripts/verify-bundle.sh "$app"

      - name: Install Qt for LibreCelik
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        with:
          version: '6.10.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtimageformats qtpdf'
          cache: true

      - name: Install jsonschema into Qt's Python
        # The Qt action puts its own Python first on PATH; LibreCelik's manifest
        # code generator runs in that one.
        run: python3 -m pip install --break-system-packages --user jsonschema

      - name: Build LibreCelik (Release, universal)
        # What the bundle ships, without its tests: GoogleTest comes from
        # Homebrew, built for the host alone, so a universal test binary cannot
        # link. LibreCelik's own CI runs the suites; the bundle is launched below.
        env:
          LC_SRC: ${{ steps.deps.outputs.librecelik-path }}
        run: |
          cmake -S "$LC_SRC" -B "$LC_SRC/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DBUILD_TESTING=OFF \
            -DLIBRESCRS_TEAM_ID="$LIBRESCRS_TEAM_ID"
          cmake --build "$LC_SRC/build" -j4

      - name: Package LibreCelik and run it
        # A bundle that verifies can still die in dyld when launched (an agent
        # that verified clean did, fixed in LibreMac 07321cd); the launch is
        # the check.
        env:
          LC_SRC: ${{ steps.deps.outputs.librecelik-path }}
        run: |
          set -euo pipefail
          mkdir -p out
          "$LC_SRC/scripts/macos/build-app.sh" "$LC_SRC/build" "$RUNNER_TEMP/lc"
          bin="$RUNNER_TEMP/lc/LibreCelik.app/Contents/MacOS/LibreCelik"
          for arch in x86_64 arm64; do lipo "$bin" -verify_arch "$arch"; done
          QT_QPA_PLATFORM=offscreen "$bin" --version
          # The Intel slice runs only where Rosetta is present.
          if /usr/bin/pgrep -q oahd || arch -x86_64 /usr/bin/true 2>/dev/null; then
            QT_QPA_PLATFORM=offscreen arch -x86_64 "$bin" --version
          else
            echo "::notice::no Rosetta on this runner; the x86_64 slice is checked by lipo only"
          fi
          cp "$RUNNER_TEMP/lc/sbom-librecelik-macos.cdx.json" out/

      - name: Disk image
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage" out
          ditto DerivedData/Build/Products/Release/LibreMac.app "$stage/LibreMac.app"
          ditto "$RUNNER_TEMP/lc/LibreCelik.app" "$stage/LibreCelik.app"
          ln -s /Applications "$stage/Applications"
          # On the hosted xcode-27 image hdiutil create has failed with
          # "Resource busy" on a tree that verified clean, while the same
          # command passes locally on macOS 27. Three tries, each failure said.
          for try in 1 2 3; do
            if hdiutil create -volname "LibreSCRS $VERSION" -srcfolder "$stage" \
                 -format UDZO -o "out/LibreSCRS-$VERSION-macos.dmg"; then
              break
            fi
            echo "::warning::hdiutil create failed (try $try of 3)"
            rm -f "out/LibreSCRS-$VERSION-macos.dmg"
            [ "$try" -lt 3 ] || exit 1
            sleep 15
          done
          # verify right after create has failed once with "Resource
          # temporarily unavailable" on an image that then verified clean.
          for try in 1 2 3; do
            if hdiutil verify "out/LibreSCRS-$VERSION-macos.dmg"; then
              break
            fi
            echo "::warning::hdiutil verify failed (try $try of 3)"
            [ "$try" -lt 3 ] || exit 1
            sleep 15
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/ci
          ref: d68f5d781a665759eaba63c67ef0e6eb1f738063
          path: .ci
          persist-credentials: false

      - name: Bill of materials for what the image bundles
        # The host is Swift with no third-party code; what the image carries
        # beyond it is the agent, which links LibreAgent statically, and the
        # LibreMiddleware dylibs staged beside it: the bill says each the way
        # it ships. Both are read from the trees built above, each at the
        # revision LibreDarwin's lock names. The
        # LibreMiddleware libraries staged here are the ones its own release
        # builds, so the bill requires what LibreMiddleware's release bill
        # requires (OpenSSL, curl, OpenSC, nlohmann-json, miniz: all built in
        # from its tree on macOS too), plus QCBOR from LibreAgent. LibreCelik's
        # application carries its own bill, built from its staged bundle.
        env:
          LD_SRC: ${{ steps.deps.outputs.libredarwin-path }}
          LA_SRC: ${{ steps.deps.outputs.libreagent-path }}
          LM_SRC: ${{ steps.lm.outputs.libremiddleware-path }}
        run: |
          "$(brew --prefix)/bin/bash" .ci/scripts/make-sbom --out out/sbom-macos.cdx.json \
            --root "$LD_SRC" --repo LibreMac \
            --static-dep "LibreAgent=$LA_SRC" --dynamic-dep "LibreMiddleware=$LM_SRC" \
            --require openssl --require curl --require opensc --require nlohmann-json --require miniz \
            --require qcbor

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: macos-artifacts
          path: out/*
          if-no-files-found: error
          retention-days: 3

  seal:
    needs: [preflight, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: macos-artifacts
          path: artifacts

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/ci
          ref: d68f5d781a665759eaba63c67ef0e6eb1f738063
          path: .ci
          persist-credentials: false

      - name: Refuse a release whose bill of materials is missing or empty
        # Before anything is signed: a signature over a document this job is
        # about to reject is worth not creating.
        run: python3 .ci/scripts/check-sbom artifacts/sbom-macos.cdx.json artifacts/sbom-librecelik-macos.cdx.json

      - uses: LibreSCRS/ci/actions/release-seal@d68f5d781a665759eaba63c67ef0e6eb1f738063
        with:
          mode: ${{ needs.preflight.outputs.mode }}
          version: ${{ needs.preflight.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sealed
          path: artifacts/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [preflight, seal]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sealed
          path: artifacts
      - uses: LibreSCRS/ci/actions/release-publish@d68f5d781a665759eaba63c67ef0e6eb1f738063
        with:
          mode: ${{ needs.preflight.outputs.mode }}
          version: ${{ needs.preflight.outputs.version }}
          is_prerelease: ${{ needs.preflight.outputs.is_prerelease }}

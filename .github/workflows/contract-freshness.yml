# SPDX-License-Identifier: LGPL-2.1-or-later
name: Contract freshness

# Reports, never blocks. This check compares the vendored contract against the
# upstream branch, so it can go red for a change made in another repository by
# someone else -- and a gate that fails for reasons the author cannot fix is a
# gate people learn to ignore. The blocking half pins instead.
#
# It runs on push as well as on a schedule: GitHub disables scheduled workflows
# after 60 days of repository inactivity, and a schedule that has quietly
# stopped looks exactly like one that keeps passing.
on:
  push:
    branches: [main, 'ci/**']
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the vendored contract against upstream
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          vendored=LibreMacAgentClient/Tests/LibreMacAgentClientTests/Contract/wire-vocabulary.json
          gh api repos/LibreSCRS/LibreAgent/contents/wire/wire-vocabulary.json \
            --jq '.content' | base64 -d > /tmp/upstream.json
          if cmp -s "$vendored" /tmp/upstream.json; then
            echo "stale=no" >> "$GITHUB_OUTPUT"
          else
            echo "stale=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the recorded revision matches the build pin
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          recorded=$(tr -d '[:space:]' < LibreMacAgentClient/Tests/LibreMacAgentClientTests/Contract/wire-vocabulary.provenance)
          # The revision lives in a file of its own, cmake/libreagent.pin. The
          # FetchContent call reads that file into a variable and pins with
          # `GIT_TAG ${LIBREAGENT_PIN}`, so it carries no SHA of its own: asking
          # the CMake file for a 40-hex literal finds nothing and reports a
          # split on every run.
          #
          # `|| true`: the step runs under `bash -e`, so a failed fetch would
          # kill it here instead of reporting -- and "no 40-hex SHA pinned" is
          # precisely the split this check exists to report, so the one case it
          # must handle was the one that killed it.
          pinned=$(gh api repos/LibreSCRS/LibreDarwin/contents/cmake/libreagent.pin \
            --jq '.content' | base64 -d | tr -d '[:space:]' || true)
          if ! printf '%s' "$pinned" | grep -Eq '^[0-9a-f]{40}$'; then
            # Empty, or a tag or branch name: nothing the recorded revision can
            # be shown to equal, so report the split and say why.
            echo "split=yes" >> "$GITHUB_OUTPUT"
            echo "recorded=$recorded pinned='$pinned' (not a 40-character revision)"
          elif [ "$recorded" = "$pinned" ]; then
            echo "split=no" >> "$GITHUB_OUTPUT"
          else
            echo "split=yes" >> "$GITHUB_OUTPUT"
            echo "recorded=$recorded pinned=$pinned"
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"

      - name: Check the prompt budget matches the agent's declared deadline
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.pin.outputs.pinned }}
        run: |
          set -o pipefail
          # Parsed by key, not by a loose digit scan: the vendored file is
          # `max-sequential-ms <n>`, and a future second number in it must
          # not silently join this one.
          vendored=$(awk '$1 == "max-sequential-ms" { print $2; exit }' \
            LibreMacAgentClient/Tests/LibreMacAgentClientTests/Contract/prompt-policy.txt)
          if ! printf '%s' "$PINNED" | grep -Eq '^[0-9a-f]{40}$'; then
            # No usable pin to compare against -- the step above already
            # reported that split, so this one stays quiet rather than
            # reporting the same gap twice.
            echo "split=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `if !` (not `|| true`): a failed fetch must be told apart from a
          # fetch that succeeded but found neither the marker nor the
          # fallback below, and this form still keeps `bash -e` from killing
          # the step, because the substitution runs as the condition of an
          # `if`, which -e never treats as fatal.
          if ! policy=$(gh api "repos/LibreSCRS/LibreAgent/contents/include/LibreSCRS/Agent/operations/PromptPolicy.h?ref=$PINNED" \
              --jq '.content' | base64 -d); then
            echo "split=yes" >> "$GITHUB_OUTPUT"
            echo "vendored=$vendored upstream='' (fetch of PromptPolicy.h at $PINNED failed)"
            exit 0
          fi
          # The agent may one day declare a dedicated sequential-chain budget
          # next to `kLongestDeadline`, marked with a `// budget-ms:` comment
          # so a reader (and this check) does not have to parse the C++
          # expression that computes it. Until that marker exists, the
          # single longest deadline is the only number vendored here, so
          # this check falls back to reading `kLongestDeadline` itself --
          # which is why it works both before and after that constant lands.
          #
          # Neither pattern is pre-filtered through `grep -m1`: `sed -n`
          # exits 0 whether or not a line matches, but `grep -m1` exits 1 on
          # no match, and under `bash -e` (GitHub's default for `run:`
          # blocks) plus the `pipefail` set above, a `grep -m1 pattern |
          # sed ...` pipeline with no match would kill the step before it
          # ever reached the fallback -- which is exactly what happens on
          # today's pin, since it carries no marker yet. The capture group
          # accepts a C++ digit separator (`300'000`) and strips it after.
          upstream=$(printf '%s\n' "$policy" \
            | sed -n "s#.*// budget-ms:[[:space:]]*\([0-9']*\).*#\1#p" \
            | head -n1 | tr -d "'")
          if [ -z "$upstream" ]; then
            upstream=$(printf '%s\n' "$policy" \
              | sed -n "s/.*kLongestDeadline{\([0-9']*\)}.*/\1/p" \
              | head -n1 | tr -d "'")
          fi
          if [ -z "$vendored" ] || [ -z "$upstream" ]; then
            echo "split=yes" >> "$GITHUB_OUTPUT"
            echo "vendored='$vendored' upstream='$upstream' (neither // budget-ms: nor kLongestDeadline found at $PINNED, or prompt-policy.txt is not in the max-sequential-ms <n> shape)"
          elif [ "$vendored" = "$upstream" ]; then
            echo "split=no" >> "$GITHUB_OUTPUT"
          else
            echo "split=yes" >> "$GITHUB_OUTPUT"
            echo "vendored=$vendored upstream=$upstream (pin $PINNED)"
          fi

      - name: Report
        if: always() && (steps.compare.outputs.stale == 'yes' || steps.pin.outputs.split == 'yes' || steps.budget.outputs.split == 'yes')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          title="Wire contract has moved ahead of the vendored copy"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          body="The published wire vocabulary no longer matches the copy in this repository, the recorded revision and the build pin disagree, or the vendored prompt budget no longer matches the agent's declared deadline at the pinned revision. Raise all of these together: refresh the vendored manifest and/or the prompt budget, update the recorded revision, and move the dependency pin in the same change."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

# SPDX-License-Identifier: LGPL-2.1-or-later
name: CI

# LibreMac is a pure-Swift macOS host: a SwiftUI menu-bar app plus a CTK
# token extension. It is LibreMiddleware-FREE at link time — the per-user
# agent (built and shipped separately, from LibreDarwin) owns the card via
# LM's PKCS#11 module, and this repo's host/extension only talk to the agent
# over the App-Group socket. There is no C/C++ left in the host, so there is
# no clang-format gate here; the Swift compiler's strict-concurrency and
# warnings-as-errors settings are the format/lint gate.
#
# Deferred: CI does NOT assemble or verify the agent bundle — that needs the
# LibreDarwin build tree plus a signing identity. Until LibreDarwin ships
# release artifacts, the release checklist (README) runs
# Scripts/bundle-agent.sh + Scripts/verify-bundle.sh locally. bundle-agent.sh
# signs the host .app as its last step; nothing re-signs the bundle after it.
# The bundle-scripts job below runs the whole script under stubs and holds it
# to that order.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    # Everything cheap that needs no macOS: a plain ubuntu runner answers in
    # seconds, where the macOS jobs below queue and bill by the minute.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the self-test runner picks its set with
      # `git ls-files`, and a shallow checkout is a known source of a
      # different set here than locally.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove the release-lockstep check still fails when it should
        run: ./ci/scripts/check-release-lockstep.selftest.sh

      - name: CHANGELOG and VERSION agree on the version this tree is heading for
        # Nothing measured this here: CHANGELOG said 5.0.0 and VERSION said
        # 5.0.0, and the two could have drifted apart in the next bump unseen.
        run: ./ci/scripts/check-release-lockstep.sh "$(head -n1 VERSION | tr -d '[:space:]')"

      # Every self-test in this repository, by pathspec, and each one must
      # report the cases it ran and how many proved the gate red. A self-test
      # nothing runs proves as much as no self-test, and a runner that read only
      # exit codes would accept `exit 0` as a body.
      - name: The release-asset check can still fail
        run: ./ci/scripts/check-release-assets.selftest.sh

      - name: The release workflow checks its asset set before publishing
        # Structural only: the job that runs gh release create runs the
        # --staged check before it, in a step that can fail the job.
        run: ./ci/scripts/check-release-assets.sh --wired

      - name: Run every self-test
        run: ./ci/scripts/run-selftests.sh

      # This repository ships in the first release and was outside every
      # meta-check: nothing measured that its gate scripts are reachable, that
      # its jobs carry a bound, or that a step can run where it was placed. All
      # three read only the tracked files and the workflows as data, so an
      # ubuntu runner answers in seconds.
      - name: Every shipped gate is reachable
        run: ./ci/scripts/check-gates-wired.sh

      - name: Every job carries a bound
        run: ./ci/scripts/check-job-timeouts.sh

      - name: Every step can run where it was placed
        run: ./ci/scripts/workflow-step-order.py

  bundle-scripts:
    # bundle-agent.sh runs nowhere in CI (see the note above), so the one thing
    # in it that is pure shell -- which LibreMiddleware soname to stage -- gets
    # its own check. It was wrong and nothing here could see it: the glob named
    # a hard-coded soname integer while LIBRESCRS_ABI_SOVERSION had moved on, so
    # the only script that assembles the macOS bundle exited 1 while staging the
    # LibreMiddleware dylibs, four sections before it signs anything. Ubuntu:
    # this is bash over fixture directories, no Apple anything.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Soname discovery behaves on clean, stale and reused prefixes
        # Also RUNS bundle-agent.sh — first its staging block over those
        # prefixes, then the whole script into a fixture .app — and asserts
        # which names land. A suite that only read the block stayed green over
        # a bundler that called the helper and overwrote its answer on the next
        # line; a rule that read the lines around the block stayed green over
        # four spellings of a second staging pass that copied a hard-coded
        # soname into Contents/Frameworks. Both are the shipped defect put
        # back, and both are now measured by what reaches the bundle.
        run: ./ci/scripts/lm-soname.selftest.sh

  swift-test:
    # Pure SwiftPM unit tests: no xcodegen, no Xcode project needed. Xcode 16
    # (and its `swift test` toolchain) is preinstalled on macos-15.
    timeout-minutes: 20
    runs-on: macos-15
    strategy:
      matrix:
        package: [LibreMacAgentClient, LibreMacShared, Tools/ts2xcstrings]
    steps:
      - uses: actions/checkout@v4

      - name: swift test (${{ matrix.package }})
        # LibreMacAgentClient includes an env-gated live-agent smoke test that
        # SKIPS unless LIBRESCRS_AGENT_SOCK is set. Deliberately not set here
        # — CI has no running agent to talk to. The PKCS#11 wire, transport,
        # and token op-engine suites live in this same package's single test
        # target, so this matrix entry already runs them — no separate entry
        # needed.
        run: swift test --package-path "${{ matrix.package }}"

  build-macos:
    # macOS 15 runner: the project deploys to macOS 15.0 and needs the
    # matching SDK (Xcode 16). Older runner images ship an SDK below the
    # deployment target and fail to link.
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - name: Install build tools
        # xcodegen generates the Xcode project. No LM build deps (autoconf/
        # automake/libtool/pkg-config/ninja/jsonschema) are needed any more —
        # the host links no LibreMiddleware.
        run: brew install xcodegen

      - uses: actions/checkout@v4
        # Single-repo checkout: no LibreMiddleware sibling, no submodules.
        # Full history: the test-floor check compares the floor with the one
        # at the base of the change and reads every commit in <base>..HEAD for
        # the trailer that names a lowering. A depth-limited fetch of the base
        # alone would cut that range short (and the merge-base the all-zeros
        # case needs), so a lowering named in a cut-off commit would read red;
        # this repository's history is small enough that depth 0 costs seconds.
        with:
          fetch-depth: 0

      - name: Generate Xcode project
        run: ./Scripts/generate-project.sh

      - name: The generated project stamps the version in VERSION
        # Every version surface in this repo is now DERIVED from VERSION at
        # generate time -- project.yml takes MARKETING_VERSION from the
        # LIBREMAC_VERSION that Scripts/generate-project.sh exports, and both
        # Info.plists reference $(MARKETING_VERSION) rather than repeating a
        # number. There is consequently no literal left for a static reader to
        # compare, which is why the version check lives on this job and not on
        # the ubuntu `lint` job: that runner has no xcodegen and no Xcode, so it
        # can neither generate this project nor build the bundle that carries
        # the only literal there is.
        #
        # This step measures the first half of the derivation. With the
        # substitution broken the project carries the unexpanded
        # ${LIBREMAC_VERSION} (measured: xcodegen exits 0 and writes the
        # placeholder through) or a stale number, and this grep finds nothing.
        #
        # Both spellings are accepted because the pbxproj serializer QUOTES any
        # value that is not a bare word -- a pre-release VERSION such as
        # 5.1.0-rc1 is written `MARKETING_VERSION = "5.1.0-rc1";` (the same
        # reason this file holds `CODE_SIGN_IDENTITY = "-";` and
        # `DEBUG_INFORMATION_FORMAT = "dwarf-with-dsym";`), so matching only the
        # unquoted form would fail the next release candidate on a tree with
        # nothing wrong with it. -F is deliberate: the version is data, not a
        # pattern, and as a regex `5.0.0` also matches `5X0Y0`.
        run: |
          want="$(head -n1 VERSION | tr -d '[:space:]')"
          hits=$(grep -cF -e "MARKETING_VERSION = $want;" \
                          -e "MARKETING_VERSION = \"$want\";" \
                          LibreMac.xcodeproj/project.pbxproj) || hits=0
          echo "MARKETING_VERSION = $want appears on $hits line(s) in project.pbxproj"
          if [ "$hits" -lt 1 ]; then
            echo "::error::the generated project does not stamp MARKETING_VERSION = $want"
            grep -n "MARKETING_VERSION" LibreMac.xcodeproj/project.pbxproj || true
            exit 1
          fi

      - name: Build and test (Debug)
        # CODE_SIGNING_ALLOWED=NO: the runner has no dev team, and the App
        # Groups entitlement needs a provisioning profile otherwise. Universal
        # (x86_64+arm64) Release builds and real signing/bundle verification
        # are a release-gate concern (Scripts/bundle-agent.sh +
        # Scripts/verify-bundle.sh, run locally), not this CI job.
        #
        # The LibreMac target depends on LibreMacToken (project.yml) and
        # xcodegen wires that as an "Embed Foundation Extensions" build
        # phase, so this one `build` action already compiles
        # LibreMacToken.appex and nests it under LibreMac.app — no separate
        # build step is needed for the token extension. Hardware acceptance
        # of the extension against ctkd + a real card is a signed-build,
        # Developer-ID-gated step and stays out of this CI job; see
        # Packaging/HARDWARE-ACCEPTANCE.md.
        #
        # -derivedDataPath pins where the products land so the step below can
        # name LibreMac.app without a second `xcodebuild -showBuildSettings`
        # invocation to go looking for it.
        #
        # -resultBundlePath and the tee'd log feed the test-floor step below.
        # pipefail: the default `bash -e` would otherwise take tee's status.
        run: |
          set -o pipefail
          xcodebuild -project LibreMac.xcodeproj -scheme LibreMac -configuration Debug \
            build test CODE_SIGNING_ALLOWED=NO -derivedDataPath DerivedData -jobs 4 \
            -resultBundlePath DerivedData/LibreMac.xcresult \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: The test action executed at least the recorded floor of tests
        # `Executed 0 tests` + `** TEST SUCCEEDED **` is what this scheme prints
        # on every healthy run (its tests are Swift Testing, not XCTest), so the
        # step above is green whether the bundle ran 134 tests or none. This
        # reads the result bundle's own count and fails on a skip, a failure, a
        # count below ci/test-floor.macos.txt, or a floor lowered since the
        # base of this change without a commit naming it; it falls back to the
        # log only if xcresulttool cannot read the bundle.
        #
        # The base is the pull request's base, or the commit this push moved
        # main from -- not HEAD~1, which on a multi-commit push already carries
        # a lowering made in any earlier commit. A `before` that a force-push
        # left out of every ref is fetched by SHA; if that fails the gate says
        # it cannot judge (rc=2). All zeros (the push that created the branch)
        # is resolved by the gate as the merge-base with origin/main.
        env:
          FLOOR_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$FLOOR_BASE" in
            ''|*[!0]*)
              if [ -n "$FLOOR_BASE" ] && ! git cat-file -e "$FLOOR_BASE^{commit}" 2>/dev/null; then
                git fetch --no-tags origin "$FLOOR_BASE" \
                  || echo "::warning::could not fetch the base $FLOOR_BASE"
              fi ;;
          esac
          ./ci/scripts/check-test-floor.sh --xcresult DerivedData/LibreMac.xcresult \
            --log "$RUNNER_TEMP/xcodebuild-test.log" \
            --base "$FLOOR_BASE" --default-ref origin/main

      - name: The built app and its token extension state the version in VERSION
        # The second half: what Xcode actually stamped. Both Info.plists in the
        # tree hold $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION), not a
        # number, so the built bundle is the only place the literal exists --
        # reading the source plists would measure the placeholder, and that is
        # the whole reason this replaced a static surface check. The extension
        # is checked separately from its host: it inherits both settings from
        # the project-level base, and an override on either target would ship
        # an app and a nested appex claiming different versions.
        #
        # CFBundleVersion rides along here too, string-compared against the
        # same VERSION. Before CURRENT_PROJECT_VERSION was wired up this key
        # read the literal placeholder `1` (an <integer>, not even the right
        # type for a dotted version) on both bundles, so this loop already
        # catches a build that reverts the substitution without needing a
        # separate plist-type check: "5.0.0" has no integer representation to
        # accidentally match.
        run: |
          want="$(head -n1 VERSION | tr -d '[:space:]')"
          app="DerivedData/Build/Products/Debug/LibreMac.app"
          rc=0
          for plist in "$app/Contents/Info" \
                       "$app/Contents/PlugIns/LibreMacToken.appex/Contents/Info"; do
            for key in CFBundleShortVersionString CFBundleVersion; do
              # || got="": without it `bash -e` exits on the first missing plist
              # and the rest of the checks are never reported.
              got="$(defaults read "$PWD/$plist" "$key")" || got=""
              if [ "$got" = "$want" ]; then
                echo "  -> $plist.plist $key states $want"
              else
                echo "::error::$plist.plist $key states '$got' but VERSION says '$want'."
                rc=1
              fi
            done
          done
          exit "$rc"

  vocabulary-consumers:
    # WireVocabularyConformanceTests proves the mirror CARRIES the contract's
    # names. This proves they are USED: every non-test source mentioning
    # SyncError is registered, every switch over it whose subject the check can
    # resolve sits at a registry anchor, every anchored switch is exhaustive
    # with no catch-all arm, and a cancel shares neither a case arm nor an
    # answer with a communication failure. A name reached main with the token
    # gate green and three consumers untouched, which is the gap this closes.
    #
    # Deliberately NOT on macos-15: it needs neither Xcode nor a Swift
    # toolchain, and a structural gate that can only be seen on an Apple runner
    # is a gate nobody watches. The selftest perturbs a throwaway copy and
    # fails if any of the eleven regressions stops being caught. The script's
    # header states what it does and does not resist, including which switch
    # subjects it cannot resolve.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: sync-error consumer gate
        run: python3 Scripts/check-sync-error-consumers.py

      - name: the gate can still fail
        run: ./ci/scripts/check-sync-error-consumers.selftest.sh

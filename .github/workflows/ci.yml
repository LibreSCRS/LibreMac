# SPDX-License-Identifier: LGPL-2.1-or-later
name: CI

# LibreMac is a pure-Swift macOS host: a SwiftUI menu-bar app plus a CTK
# token extension. It is LibreMiddleware-FREE at link time — the per-user
# agent (built and shipped separately, from LibreDarwin) owns the card via
# LM's PKCS#11 module, and this repo's host/extension only talk to the agent
# over the App-Group socket. There is no C/C++ left in the host, so there is
# no clang-format gate here; the Swift compiler's strict-concurrency and
# warnings-as-errors settings are the format/lint gate.
#
# Deferred: CI does NOT assemble or verify the agent bundle — that needs the
# LibreDarwin build tree plus a signing identity. Until LibreDarwin ships
# release artifacts, the release checklist runs Scripts/bundle-agent.sh +
# Scripts/verify-bundle.sh locally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    # Everything cheap that needs no macOS: a plain ubuntu runner answers in
    # seconds, where the macOS jobs below queue and bill by the minute.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prove the version-surface check still fails when it should
        run: ./ci/scripts/check-version-surfaces.selftest.sh

      - name: Every surface states the version in VERSION
        # VERSION had no reader at all here: the bundle said 0.1.0 and the host
        # announced itself to the agent as LibreMac/0.1.0.
        run: ./ci/scripts/check-version-surfaces.sh

  bundle-scripts:
    # bundle-agent.sh runs nowhere in CI (see the note above), so the one thing
    # in it that is pure shell -- which LibreMiddleware soname to stage -- gets
    # its own check. It was wrong for the whole cycle: the glob named a soname
    # integer from the previous line while LIBRESCRS_ABI_SOVERSION had moved on,
    # so the only script that assembles the macOS bundle exited 1 on the last
    # step before signing, and nothing here could see it. Ubuntu: this is bash
    # over fixture directories, no Apple anything.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Soname discovery behaves on clean, stale and reused prefixes
        # Also RUNS bundle-agent.sh — first its staging block over those
        # prefixes, then the whole script into a fixture .app — and asserts
        # which names land. A suite that only read the block stayed green over
        # a bundler that called the helper and overwrote its answer on the next
        # line; a rule that read the lines around the block stayed green over
        # four spellings of a second staging pass that copied a hard-coded
        # soname into Contents/Frameworks. Both are the shipped defect put
        # back, and both are now measured by what reaches the bundle.
        run: ./ci/scripts/lm-soname.selftest.sh

  swift-test:
    # Pure SwiftPM unit tests: no xcodegen, no Xcode project needed. Xcode 16
    # (and its `swift test` toolchain) is preinstalled on macos-15.
    timeout-minutes: 20
    runs-on: macos-15
    strategy:
      matrix:
        package: [LibreMacAgentClient, LibreMacShared, Tools/ts2xcstrings]
    steps:
      - uses: actions/checkout@v4

      - name: swift test (${{ matrix.package }})
        # LibreMacAgentClient includes an env-gated live-agent smoke test that
        # SKIPS unless LIBRESCRS_AGENT_SOCK is set. Deliberately not set here
        # — CI has no running agent to talk to. The PKCS#11 wire, transport,
        # and token op-engine suites live in this same package's single test
        # target, so this matrix entry already runs them — no separate entry
        # needed.
        run: swift test --package-path "${{ matrix.package }}"

  build-macos:
    # macOS 15 runner: the project deploys to macOS 15.0 and needs the
    # matching SDK (Xcode 16). Older runner images ship an SDK below the
    # deployment target and fail to link.
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - name: Install build tools
        # xcodegen generates the Xcode project. No LM build deps (autoconf/
        # automake/libtool/pkg-config/ninja/jsonschema) are needed any more —
        # the host links no LibreMiddleware.
        run: brew install xcodegen

      - uses: actions/checkout@v4
        # Single-repo checkout: no LibreMiddleware sibling, no submodules.

      - name: Generate Xcode project
        run: ./Scripts/generate-project.sh

      - name: Build and test (Debug)
        # CODE_SIGNING_ALLOWED=NO: the runner has no dev team, and the App
        # Groups entitlement needs a provisioning profile otherwise. Universal
        # (x86_64+arm64) Release builds and real signing/bundle verification
        # are a release-gate concern (Scripts/bundle-agent.sh +
        # Scripts/verify-bundle.sh, run locally), not this CI job.
        #
        # The LibreMac target depends on LibreMacToken (project.yml) and
        # xcodegen wires that as an "Embed Foundation Extensions" build
        # phase, so this one `build` action already compiles
        # LibreMacToken.appex and nests it under LibreMac.app — no separate
        # build step is needed for the token extension. Hardware acceptance
        # of the extension against ctkd + a real card is a signed-build,
        # Developer-ID-gated step and stays out of this CI job; see
        # Packaging/HARDWARE-ACCEPTANCE.md.
        run: |
          xcodebuild -project LibreMac.xcodeproj -scheme LibreMac -configuration Debug \
            build test CODE_SIGNING_ALLOWED=NO

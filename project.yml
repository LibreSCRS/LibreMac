name: LibreMac
options:
  bundleIdPrefix: org.librescrs
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  groupSortPosition: bottom
  generateEmptyDirectories: true
  xcodeVersion: "16.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    # The one place the marketing version is stated. Scripts/generate-project.sh
    # exports LIBREMAC_VERSION from the VERSION file and xcodegen substitutes it
    # here at generate time; both Info.plists then reference
    # $(MARKETING_VERSION) rather than repeating the number. Project-level so
    # the app AND the nested token extension inherit the same value.
    MARKETING_VERSION: ${LIBREMAC_VERSION}
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    PRODUCT_NAME: "$(TARGET_NAME)"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
packages:
  LibreMacShared:
    path: LibreMacShared
  LibreMacAgentClient:
    path: LibreMacAgentClient
targets:
  LibreMac:
    type: application
    platform: macOS
    sources:
      - path: LibreMac
        excludes:
          - LibreMacToken/**
    dependencies:
      - package: LibreMacShared
        product: LibreMacShared
      - package: LibreMacAgentClient
        product: LibreMacAgentClient
      - target: LibreMacToken
    info:
      path: LibreMac/Info.plist
      properties:
        CFBundleDisplayName: LibreMac
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: 1
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright (c) 2026 hirashix0. LGPL-2.1-or-later."
        NSPrincipalClass: NSApplication
    entitlements:
      path: LibreMac/LibreMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.org.librescrs.LibreMac
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.librescrs.LibreMac
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_ENTITLEMENTS: LibreMac/LibreMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: "Regenerate Localizable.xcstrings from .ts"
        script: |
          set -e
          # Resolve LibreCelik checkout in priority order:
          #   $LIBRESCRS_LC_DIR (explicit override)
          #   $LIBRESCRS_ROOT/LibreCelik (multi-repo root)
          #   sibling layout: <SRCROOT>/../LibreCelik
          if [ -n "$LIBRESCRS_LC_DIR" ]; then
              LC="$LIBRESCRS_LC_DIR"
          elif [ -n "$LIBRESCRS_ROOT" ]; then
              LC="$LIBRESCRS_ROOT/LibreCelik"
          else
              LC="$SRCROOT/../LibreCelik"
          fi
          # Regeneration MUST only run with LibreCelik present: the committed
          # catalog stays authoritative when it's absent, and we never
          # regenerate without the full input set. ts2xcstrings does carry
          # forward committed entries missing from its imports, but that path
          # is fragile — the carry-forward decode is a silent `try?` (a
          # decode failure drops every carried key without warning) and
          # re-encoding passes entries through a subset model that strips
          # unknown fields. The real protections are this early exit plus the
          # no-overlap rule (no LibreMac .ts id may start with `lc-`).
          if [ ! -f "$LC/resources/i18n/LibreCelik_en.ts" ]; then
              echo "warning: LibreCelik .ts files not found at $LC; using committed Localizable.xcstrings as-is" >&2
              exit 0
          fi
          mkdir -p "$SRCROOT/LibreMac/Resources"
          swift run --package-path "$SRCROOT/Tools/ts2xcstrings" ts2xcstrings \
              --output "$SRCROOT/LibreMac/Resources/Localizable.xcstrings" \
              "$LC/resources/i18n/LibreCelik_en.ts" \
              "$LC/resources/i18n/LibreCelik_sr_RS.ts" \
              "$SRCROOT/LibreMac/Resources/i18n/LibreMac_en.ts" \
              "$SRCROOT/LibreMac/Resources/i18n/LibreMac_sr_RS.ts"
        outputFiles:
          - "$(SRCROOT)/LibreMac/Resources/Localizable.xcstrings"
        basedOnDependencyAnalysis: false
  LibreMacToken:
    type: app-extension
    platform: macOS
    sources:
      - path: LibreMac/LibreMacToken
    dependencies:
      - package: LibreMacAgentClient
        product: LibreMacAgentClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.librescrs.LibreMac.LibreMacToken
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        # Hand-written NSExtension dict (com.apple.ctk-tokens + driver class) —
        # a generated `info:` block would clobber it, so this is wired via
        # INFOPLIST_FILE, not the managed `info:` key.
        INFOPLIST_FILE: LibreMac/LibreMacToken/Info.plist
        CODE_SIGN_ENTITLEMENTS: LibreMac/LibreMacToken/LibreMacToken.entitlements
  LibreMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LibreMacTests
    dependencies:
      - target: LibreMac
      - package: LibreMacShared
        product: LibreMacShared
      - package: LibreMacAgentClient
        product: LibreMacAgentClient
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LibreMac.app/Contents/MacOS/LibreMac
        PRODUCT_BUNDLE_IDENTIFIER: org.librescrs.LibreMac.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"
schemes:
  LibreMac:
    build:
      targets:
        LibreMac: all
        LibreMacTests: [test]
    test:
      gatherCoverageData: true
      targets: [LibreMacTests]
    run:
      executable: LibreMac
    archive:
      config: Release
